components:
  schemas:
    PostBookingsRequest:
      type: object
      properties:
        customer:
          type: string
          description: Customer information (firstName, lastName, phone, etc.)
        items:
          type: string
          description: Array of booking items with productCode, startTimeLocal and quantities
        payments:
          type: string
          description: Payment details when using manual payment
      required:
      - customer
      - items
    PutBookingsRequest:
      type: object
      properties:
        resellerReference:
          type: string
          description: Reference string for the reseller
        resellerComments:
          type: string
          description: Comments visible to both agent and supplier
        status:
          type: string
          description: Booking status (e.g., CONFIRMED)
        customer:
          type: string
          description: Customer object with id and details
        items:
          type: string
          description: Array of items with possible pickupLocation updates
    PutBookingsOrdernumberRequest:
      type: object
      properties:
        resellerReference:
          type: string
          description: Reseller reference
        status:
          type: string
          description: New status
        customer:
          type: string
          description: Updated customer details
    GetCompaniesCompanyaliasResponse:
      type: object
      properties:
        company:
          type: object
          description: Company details.
    PostProductsRequest:
      type: object
      properties:
        product:
          type: object
          description: Product data as described in the API documentation.
      required:
      - product
    PostProductsProductcodeRequest:
      type: object
      properties:
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Full description
        priceOptions:
          type: string
          description: Array of price option objects
      required:
      - name
      - priceOptions
    PutProductsProductcodeRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated product name
        description:
          type: string
          description: Updated description
        priceOptions:
          type: string
          description: Updated price options
    PostProductsProductcodeImagesRequest:
      type: object
      properties:
        image:
          type: object
          description: Image data (e.g., URL or file payload) as defined by the API.
      required:
      - image
    GetProductsProductcodePickupsResponse:
      type: object
      properties:
        pickups:
          type: array
          description: Pickup locations associated with the product.
    GetResourcesResponse:
      type: object
      properties:
        resources:
          type: array
          description: List of resources.
    GetResourcesSessionResponse:
      type: object
      properties:
        sessions:
          type: array
          description: Resources for a session.
    GetResourcesResourceidSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          description: Sessions associated with the resource.
    GetVouchersResponse:
      type: object
      properties:
        vouchers:
          type: array
          description: List of vouchers.
